# Relay process config (WebSocket relay + remote-store client)

debug: false

remote:
  # Remote EventStore address used by relay client
  grpc_listen_addr: "localhost:50051"
  api_key: "demo-quick-start-key-2026"
  request_timeout: 10

query:
  default_limit: 100
  execution_timeout_seconds: 30

# Replaceable kinds for pubkey+kind deduplication (per Nostr protocol).
# kind 10000-19999 are always replaceable (hardcoded).
# Add 0 and/or 3 here to enable replaceable semantics for them.
replaceable_kinds:
  - 0
  - 3
