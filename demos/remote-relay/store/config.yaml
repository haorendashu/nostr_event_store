# EventStore process config (remote server mode)

debug: false

storage:
  data_dir: "./eventData"
  page_size: 4096
  max_segment_size: 1073741824
  event_buffer_size: 16777216
  write_batch_size: 500

index:
  index_dir: "./eventData/indexes"
  initialization_mode: "standard"
  flush_interval_ms: 500
  dirty_threshold: 512
  enable_time_partitioning: true
  partition_granularity: "monthly"
  enable_partition_cache_coordinator: true

  cache:
    primary_index_cache_mb: 50
    author_time_index_cache_mb: 50
    search_index_cache_mb: 100
    kind_time_index_cache_mb: 50
    eviction_policy: "lru"
    cache_concurrency: 16
    dynamic_allocation: false

wal:
  disabled: false
  wal_dir: "./eventData/wal"
  sync_mode: "batch"
  batch_interval_ms: 80
  batch_size_bytes: 10485760
  max_segment_size: 1073741824       # 1 GB per segment, triggers rotation
  checkpoint_interval_ms: 30000      # checkpoint every 30 seconds
  checkpoint_event_count: 5000       # checkpoint every 5000 events
  max_retained_segments: 0           # 0 = keep all old segments; N = keep at most N old segments

compaction:
  enabled: true
  fragmentation_threshold: 0.2
  compaction_interval_ms: 60000
  max_concurrent_compactions: 2
  preserve_old_segments: false

query:
  default_limit: 100
  default_kinds: [0, 1, 3, 6, 16, 20]
  execution_timeout_seconds: 30

remote:
  mode: "remote"
  grpc_listen_addr: "localhost:50051"
  api_key: "demo-quick-start-key-2026"
  request_timeout: 10
